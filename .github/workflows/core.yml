name: macOS
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci --prefix app --no-audit --no-fund
      - run: npm run build --prefix app
      - run: npm test --prefix app
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked -- --nocapture
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p app --features custom-protocol --locked
      - run: make -C runtime/macos-items all test
      - run: npm run desktop:mac --prefix app
